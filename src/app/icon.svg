<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Boxing Center">
  <!--
    Favicon — la langue de la famille Boxing Center.

    Les sites frères (Muret, Colomiers, Cugnaux, Labège, L'Union, Castelginest…)
    partagent tous la même construction : carré encre, anneau cuivre, monogramme
    blanc. Deux salles ne portent jamais les mêmes lettres ; c'est ce qui les
    distingue dans une barre d'onglets.

    Ici les lettres sont BC, parce que ce produit n'est pas une salle : c'est la
    plateforme de réservation de tout le réseau. Le cuivre est la seconde couleur
    du logo officiel et n'appartient à aucune salle en particulier — il est donc
    exactement à sa place sur la surface qui les réunit.

    Le logo officiel complet (BOXING CENTER arqué) ne se lit pas à 16 px : c'est
    précisément pourquoi la famille a ce système. Le vrai logo est dans l'en-tête,
    en fichier, jamais recomposé en texte.
  -->
  <rect width="192" height="192" fill="#1e2044"/>
  <circle cx="96" cy="96" r="66" fill="none" stroke="#b8763a" stroke-width="13"/>
  <text x="96" y="97"
        font-family="Bebas Neue, Oswald, Haettenschweiler, Impact, sans-serif"
        font-size="74" font-weight="700" letter-spacing="1"
        fill="#f3efe6" text-anchor="middle" dominant-baseline="central">BC</text>
</svg>
